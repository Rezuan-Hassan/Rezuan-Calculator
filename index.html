<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezuan Calculator | Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rezuan Calculator</h1>
            <div class="nav-bar">
                <button class="nav-btn active">Calculator</button>
                <button class="nav-btn" onclick="toggle('sci-panel')">Scientific Options</button>
            </div>
        </header>

        <div class="calc-box">
            <div class="display-area">
                <span id="unit-indicator">DEG</span>
                <input type="text" id="main-display" value="0" readonly>
            </div>

            <div id="sci-panel" class="keypad scientific hidden">
                <button class="btn sci" onclick="ins('Math.sin(')">sin</button>
                <button class="btn sci" onclick="ins('Math.cos(')">cos</button>
                <button class="btn sci" onclick="ins('Math.tan(')">tan</button>
                <button class="btn sci" onclick="ins('Math.PI')">π</button>
                <button class="btn sci" onclick="ins('Math.log10(')">log</button>
                <button class="btn sci" onclick="ins('Math.log(')">ln</button>
                <button class="btn sci" onclick="ins('Math.sqrt(')">√</button>
                <button class="btn sci" onclick="ins('**')">^</button>
            </div>

            <div class="keypad standard">
                <button class="btn opt" onclick="clr()">AC</button>
                <button class="btn opt" onclick="del()">DEL</button>
                <button class="btn opt" onclick="toggleUnit()">DRG</button>
                <button class="btn opt" onclick="ins('/')">÷</button>

                <button class="btn num" onclick="ins('7')">7</button>
                <button class="btn num" onclick="ins('8')">8</button>
                <button class="btn num" onclick="ins('9')">9</button>
                <button class="btn opt" onclick="ins('*')">×</button>

                <button class="btn num" onclick="ins('4')">4</button>
                <button class="btn num" onclick="ins('5')">5</button>
                <button class="btn num" onclick="ins('6')">6</button>
                <button class="btn opt" onclick="ins('-')">-</button>

                <button class="btn num" onclick="ins('1')">1</button>
                <button class="btn num" onclick="ins('2')">2</button>
                <button class="btn num" onclick="ins('3')">3</button>
                <button class="btn opt" onclick="ins('+')">+</button>

                <button class="btn num" onclick="ins('0')">0</button>
                <button class="btn num" onclick="ins('.')">.</button>
                <button class="btn run" onclick="run()" style="grid-column: span 2;">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
